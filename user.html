<!DOCTYPE html>
<html>
<head>
    <title>User Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <nav class="navbar dashboard-nav">

        <div class="logo">💰 Expense Tracker</div>

        <div>
            <span id="welcomeUser"></span>
            <button onclick="logout()" class="logout-btn">
                Logout
            </button>
        </div>

    </nav>

    <main class="dashboard">

        <div class="dashboard-heading">
            <div>
                <p class="small-title">USER MODULE</p>
                <h1>My Dashboard 👋</h1>
                <p>Manage your daily expenses easily.</p>
            </div>

            <button onclick="addExpense()" class="main-btn">
                + Add Expense
            </button>
        </div>

        <div class="stats">

            <div class="stat-card purple">
                <div class="stat-icon">💰</div>
                <p>Total Expenses</p>
                <h2 id="totalExpense">₹0</h2>
            </div>

            <div class="stat-card pink">
                <div class="stat-icon">📅</div>
                <p>Number of Expenses</p>
                <h2 id="expenseCount">0</h2>
            </div>

            <div class="stat-card green">
                <div class="stat-icon">🎯</div>
                <p>Monthly Budget</p>
                <h2>₹10,000</h2>
            </div>

            <div class="stat-card orange">
                <div class="stat-icon">💵</div>
                <p>Remaining</p>
                <h2 id="remaining">₹10,000</h2>
            </div>

        </div>

        <div class="content-card">

            <div class="card-heading">
                <h2>My Recent Expenses</h2>
                <button onclick="showExpenses()" class="view-btn">
                    View All
                </button>
            </div>

            <div id="expenseList"></div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
